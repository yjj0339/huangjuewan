<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>云桥叠翠 · 五层互通立交 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #dfe9f2; }
  #app, #app canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  /* 顶部标题 */
  #title {
    position: fixed; top: 18px; left: 22px; z-index: 10; pointer-events: none;
    color: #24384a;
    background: rgba(255,255,255,.66); backdrop-filter: blur(10px);
    padding: 10px 16px; border-radius: 14px;
    box-shadow: 0 2px 12px rgba(60,90,120,.16); border: 1px solid rgba(255,255,255,.85);
  }
  #title h1 { font-size: 26px; letter-spacing: 2px; font-weight: 700; }
  #title p { font-size: 13px; opacity: .92; margin-top: 4px; }

  /* 控制面板（浅色玻璃） */
  #panel {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10; flex-wrap: wrap; justify-content: center;
    background: rgba(255,255,255,.72); backdrop-filter: blur(12px);
    padding: 10px 12px; border-radius: 16px;
    box-shadow: 0 6px 24px rgba(60,90,120,.18); border: 1px solid rgba(255,255,255,.8);
  }
  #panel button {
    border: none; cursor: pointer; font-family: inherit;
    background: rgba(255,255,255,.9); color: #34495e;
    font-size: 13px; padding: 8px 14px; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(70,100,130,.16); transition: all .18s;
  }
  #panel button:hover { background: #eaf4fd; transform: translateY(-1px); }
  #panel button.on { background: #3498db; color: #fff; }
  #fps-badge {
    position: fixed; top: 18px; right: 22px; z-index: 10;
    visibility: hidden;
    background: rgba(255,255,255,.72); backdrop-filter: blur(12px);
    padding: 8px 14px; border-radius: 12px; color: #34495e; font-size: 13px;
    box-shadow: 0 2px 10px rgba(60,90,120,.15); border: 1px solid rgba(255,255,255,.8);
  }
  /* 驾驶 HUD */
  #drive-hud {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: none; text-align: center;
    background: rgba(255,255,255,.78); backdrop-filter: blur(12px);
    padding: 10px 22px; border-radius: 14px; color: #2c3e50;
    box-shadow: 0 4px 18px rgba(60,90,120,.2); border: 1px solid rgba(255,255,255,.85);
  }
  #drive-hud .row1 { display: flex; align-items: baseline; gap: 8px; justify-content: center; }
  #drive-hud b { font-size: 30px; font-weight: 700; color: #1f6fb8; }
  #drive-hud .unit { font-size: 12px; color: #7f97ab; }
  #hud-road { font-size: 14px; font-weight: 600; color: #34495e; }
  #hud-hint { margin-top: 4px; font-size: 12.5px; color: #5d7288; }
  /* 触屏驾驶按钮 */
  #touch-controls {
    position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
    width: min(340px, calc(100vw - 24px)); z-index: 11;
    display: none; justify-content: space-between; gap: 8px; pointer-events: none;
  }
  #touch-controls button {
    pointer-events: auto; width: 74px; height: 60px; border: none; border-radius: 16px;
    font-size: 17px; font-weight: 700; font-family: inherit; color: #2c3e50;
    background: rgba(255,255,255,.85); box-shadow: 0 4px 14px rgba(60,90,120,.25);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #touch-controls button:active { background: #3498db; color: #fff; }
  /* 图例 */
  #legend {
    position: fixed; top: 74px; right: 22px; z-index: 9;
    background: rgba(255,255,255,.72); backdrop-filter: blur(12px);
    padding: 12px 16px; border-radius: 12px; color: #34495e; font-size: 12.5px; line-height: 1.9;
    box-shadow: 0 2px 10px rgba(60,90,120,.15); border: 1px solid rgba(255,255,255,.8);
  }
  #legend b { font-size: 13px; }
  .lv { display: inline-block; width: 26px; text-align: center; border-radius: 5px; color: #fff; margin-right: 6px; font-size: 11.5px; }
  /* 加载页 */
  #loading {
    position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(180deg, #dfeaf4, #f4f8fb); transition: opacity .6s;
  }
  #loading h2 { color: #34495e; font-size: 22px; letter-spacing: 4px; }
  #loading .bar { width: 220px; height: 6px; border-radius: 3px; background: #cfdde8; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: #3498db; animation: load 1.1s ease-in-out infinite; }
  @keyframes load { 0% { transform: translateX(-100%);} 100% { transform: translateX(320%);} }
  /* 驾驶小地图 */
  #minimap {
    position: fixed; right: 22px; bottom: 96px; z-index: 9;
    display: none; padding: 8px; border-radius: 14px;
    background: rgba(255,255,255,.78); backdrop-filter: blur(10px);
    box-shadow: 0 4px 16px rgba(60,90,120,.2); border: 1px solid rgba(255,255,255,.85);
  }
  #minimap canvas { display: block; border-radius: 8px; }
  body.in-car #minimap { display: block; }
  body.hideui #minimap { display: none !important; }
  /* 拍照模式：隐藏全部界面，右下角小圆点恢复 */
  #showui {
    position: fixed; right: 14px; bottom: 14px; z-index: 20;
    display: none; width: 34px; height: 34px; border-radius: 50%;
    border: none; cursor: pointer; font-size: 15px; color: #34495e;
    background: rgba(255,255,255,.85); box-shadow: 0 2px 10px rgba(60,90,120,.25);
  }
  body.hideui #title, body.hideui #legend, body.hideui #panel,
  body.hideui #fps-badge, body.hideui #drive-hud, body.hideui #touch-controls { display: none !important; }
  body.hideui #showui { display: block; }
  @media (max-width: 640px) {
    #title h1 { font-size: 19px; } #title p { font-size: 11px; }
    #panel button { font-size: 12px; padding: 7px 10px; }
    #legend { display: none; }
    #minimap { right: 10px; top: 58px; bottom: auto; padding: 5px; }
    #minimap canvas { width: 126px; height: 126px; }
    #drive-hud { top: 8px; padding: 6px 12px; }
    #drive-hud b { font-size: 22px; }
    #touch-controls { bottom: 250px; }
    #touch-controls button { width: 60px; height: 52px; font-size: 15px; border-radius: 13px; }
    body.in-car #title { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="title">
  <h1>云桥叠翠 · 五层互通立交</h1>
  <p>参照重庆黄桷湾立交 · 5 层 20 匝道 8 方向 · Three.js 写实场景</p>
</div>

<div id="fps-badge">FPS <b id="fps">--</b></div>

<div id="drive-hud">
  <div class="row1"><b id="hud-speed">0</b><span class="unit">km/h</span><span id="hud-road"></span></div>
  <div id="hud-hint"></div>
</div>

<div id="touch-controls">
  <button id="tc-brake">刹车</button>
  <button id="tc-left">←</button>
  <button id="tc-right">→</button>
  <button id="tc-gas">油门</button>
</div>

<div id="minimap"><canvas id="minimap-cv" width="170" height="170"></canvas></div>

<div id="legend">
  <b>立体层数</b><br>
  <span class="lv" style="background:#3498db">5层</span>对角主线D · 高架 36m<br>
  <span class="lv" style="background:#2ecc71">4层</span>对角主线C · 高架 27m<br>
  <span class="lv" style="background:#e67e22">3层</span>南北主线B · 高架 18m<br>
  <span class="lv" style="background:#9b59b6">2层</span>东西主线A · 高架 9m<br>
  <span class="lv" style="background:#7f8c8d">1层</span>地面道路 · 绿地公园
</div>

<div id="panel">
  <button data-view="bird">鸟瞰全貌</button>
  <button data-view="under">桥下仰视</button>
  <button data-view="spiral">螺旋匝道</button>
  <button data-view="street">主线穿行</button>
  <button data-view="tower">塔俯市景</button>
  <button data-view="north">北向远眺</button>
  <button id="followRandom">🎬 跟随车辆</button>
  <button id="drive">🚗 自由驾驶</button>
  <button id="sound">🔊 音效</button>
  <button id="hideui">📷 隐藏界面</button>
  <button id="spin">自动环视</button>
</div>
<button id="showui" title="显示界面 (H)">👁</button>

<div id="loading"><h2>正在架设立交桥…</h2><div class="bar"><i></i></div></div>

<script>
  // 模块加载失败兜底：提示强刷而不是无限等待
  window.addEventListener('error', (e) => {
    if (!window.__READY && e.message) {
      const h = document.querySelector('#loading h2');
      if (h) h.textContent = '加载失败：请按 Ctrl+F5 强制刷新（浏览器缓存了旧版本）';
    }
  }, true);
</script>
<script type="module">
  import './src/main.js?v=35';
  // 场景首帧渲染完成后淡出加载页；12s 提示构建中、30s 提示强刷，但始终继续等待
  const t0 = performance.now();
  let hinted = false;
  const wait = setInterval(() => {
    const h = document.querySelector('#loading h2');
    if (window.__READY) {
      const el = document.getElementById('loading');
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 650);
      clearInterval(wait);
    } else if (!hinted && performance.now() - t0 > 12000) {
      hinted = true;
      if (h) h.textContent = '场景较大，仍在构建（首次约需 10~20 秒）…';
    } else if (hinted && performance.now() - t0 > 30000) {
      if (h) h.textContent = '加载异常缓慢：请按 Ctrl+F5 强制刷新重试';
    }
  }, 120);
</script>
</body>
</html>
